<!doctype html><html><body><h1>Level 5.0 Spring Boot Agentic AI</h1><div id="chat"></div><input id="q" placeholder="Ask the agent" style="width:70%;padding:10px"><button onclick="send()">Send</button><script>async function send(){let q=document.getElementById('q').value;chat.innerHTML+=`<p><b>You:</b> ${q}</p>`;q.value='';let r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:q,sessionId:'demo'})});let d=await r.json();chat.innerHTML+=`<p><b>Agent:</b> ${d.answer}</p><small>Steps: ${d.steps}<br>${JSON.stringify(d.trace)}</small>`}</script></body></html>
